<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-button slot="start" color="light">
      <ion-menu-button auto-hide="false"></ion-menu-button>
    </ion-button>
    <ion-title style="text-align: center">Users</ion-title>
    <ion-button slot="end" color="light" [routerLink]="['/notification']">
      <ion-icon name="notifications-outline" style="padding: 2vh"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">users</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-segment [(ngModel)]="tampilan">
    <ion-segment-button value="liked">
      <ion-label>Most Liked</ion-label>
    </ion-segment-button>
    <ion-segment-button value="All">
      <ion-label>All User</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div *ngIf="tampilan=='liked'">
    <ion-grid>
      <ion-row *ngFor="let item of usersMostLiked" style="
          border: 2px solid #ffffff;
          border-radius: 12px;
          margin: 16px;
          padding: 16px;
        ">
        <ion-col style="display: flex; align-items: center">
          <img [src]="item.url_foto" style="
              height: 12vh;
              width: 12vh;
              object-fit: cover;
              border-radius: 50%;
            " />
          <div style="margin-left: 16px">
            <h3 style="margin-top: 0">{{ item.username }}</h3>
            since {{ item.tgl_akun_dibuat | date:'yyyy' }}
          </div>
        </ion-col>
        <ion-col class="ion-text-end">
          <!-- Align content to the end (right) -->
          <h3>{{ item.like_count }} like(s)</h3>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <div *ngIf="tampilan=='All'">
    <ion-grid>
      <ion-row *ngFor="let item of users" style="
          border: 2px solid #ffffff;
          border-radius: 12px;
          margin: 16px; 
          padding: 16px;
        ">
        <ion-col style="display: flex; align-items: center">
          <img [src]="item.url_foto" style="
              height: 12vh;
              width: 12vh;
              object-fit: cover;
              border-radius: 50%;
            " />
          <div style="margin-left: 16px">
            <h3 style="margin-top: 0">{{ item.username }}</h3>
            since {{ item.tgl_akun_dibuat | date:'yyyy' }} <br />
          </div>
        </ion-col>
        <ion-col class="ion-text-end">
          <!-- Align content to the end (right) -->
          <!-- <h1>{{ item.totalLike }}</h1> -->
          <h5>Latest Post: {{ item.latest_post}}</h5>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
