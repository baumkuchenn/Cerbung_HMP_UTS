<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-button slot="start" color="light">
      <ion-menu-button auto-hide="false"></ion-menu-button>
    </ion-button>
    <ion-title style="text-align: center">Notifications</ion-title>
    <ion-button slot="end" color="light" [routerLink]="['/home']">
      <ion-icon name="notifications" style="padding: 2vh"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">notification</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-card *ngFor="let notification of notifications">
    <ion-card-content>
      {{notification.tgl_notifikasi | date:'dd/MM/yyyy'}} <br>
      {{ notification.username_pengirim }} {{ notification.isi_notifikasi }}
    </ion-card-content>
  </ion-card>
</ion-content>
