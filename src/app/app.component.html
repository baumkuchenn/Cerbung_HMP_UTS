<ion-app>
  <ion-router-outlet id="main-content"></ion-router-outlet>
  <ion-menu content-id="main-content">
    <ion-content class="ion-padding">
      <ion-list>
        <ion-menu-toggle>
          <ion-item routerLink="/home">
            <ion-icon name="home" slot="start"></ion-icon>
            <ion-label>Home</ion-label>
          </ion-item>
          <ion-item routerLink="/about">
            <ion-icon name="alert-circle" slot="start"></ion-icon>
            <ion-label>About</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-tabs>
    <ion-tab-bar *ngIf="!isLoginAndRegisterPage()" slot="bottom">
      <ion-tab-button tab="home">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="following">
        <ion-icon name="book-outline"></ion-icon>
        <ion-label>Following</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="create">
        <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
        <ion-label>Create</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="users">
        <ion-icon name="people-outline"></ion-icon>
        <ion-label>Users</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="pref">
        <ion-icon name="settings-outline"></ion-icon>
        <ion-label>Pref</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-app>
